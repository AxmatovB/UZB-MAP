      <span class="hdr-ic ms">layers</span>

      <span class="hdr-x ms" onclick="closeLayerPanel()" title="Ёпиш">close</span>

    <div class="hdr-sub">Қатламни ёқинг — нуқтани босинг, маълумот чиқади</div>

    <div id="lg-districts"></div><div id="lg-metro"></div><span id="appver"></span>

<script>
"use strict";
/* Versiya belgisi — yangi versiya yuklanganini tekshirish uchun (kesh muammosi bo'lsa bilish) */
const APPVER = "v16 · 15-iyul";
console.log("XARITA VERSIYA:", APPVER);
document.addEventListener("DOMContentLoaded",()=>{ const e=document.getElementById("appver"); if(e) e.textContent="· "+APPVER; });
/* layers panel slide open/close (matches the prototype animation) */
function closeLayerPanel(){ resetAllLayers(); document.getElementById('side').classList.add('closed'); const p=document.getElementById('mapPill'); if(p) p.classList.add('show'); }
function openLayerPanel(){ document.getElementById('side').classList.remove('closed'); const p=document.getElementById('mapPill'); if(p) p.classList.remove('show'); }
/* Closing the panel via X must leave the map exactly as if every active
   filter had been clicked off by hand first — not just hidden behind the
   panel with layers still drawn underneath. Defined here (before `layers`
   exists yet) but only ever called after renderToggles() has populated it. */
function resetAllLayers(){
  for(const key in layers){
    const l=layers[key];
    if(!l.on) continue;
    l.on=false;
    if(l.btn) l.btn.classList.remove('on');
    map.removeLayer(l.group);
    if(key==="regions") syncRegionSubgroups(false);
  }
}
/* ============================= HUDUDLAR MA'LUMOTI ============================= */
const DISTRICTS = [
 {name:"Қибрай тумани", latin:"Qibray tumani", color:"#e6550d", area:"486 km²", pop:"~354 000 киши (2023)",

/* Ranglar: SERVER — hamma uchun bitta. Admin o'zgartiradi, hamma ko'radi.
   Rangni tanlash faqat adminda: operatorда o'ng klик rang palitrasini umuman
   ochмайди. Bu — сайт эгасининг талаби: карта ранглари бир хил бўлиши керак,
   ҳар оператор ўзича бўяб юбормаслиги керак.

   The map runs in an iframe from the SAME origin as the app, so it can read the
   app's own session straight out of localStorage. This flag only decides what
   is drawn — the server verifies the admin session on every write, so hiding
   the UI is convenience, not the security boundary. */
const IS_ADMIN=(function(){ try{ return !!localStorage.getItem("cm_admin_session"); }catch(e){ return false; } })();
function adminHeaders(){
  const h={"Content-Type":"application/json"};
  try{ const a=localStorage.getItem("cm_admin_session"); if(a) h["x-admin-session"]=a; }catch(e){}
  return h;
}
for(const d of DISTRICTS) d.origColor=d.color;
let SERVER_PREFS={};
async function loadServerPrefs(){
  if(!location.protocol.startsWith("http")) return;
  try{ SERVER_PREFS = await (await fetch("/api/prefs")).json(); }catch(e){}
}
/* The server copy is the ONLY source now. localStorage used to be merged in
   underneath it, which meant an operator who had recoloured a district before
   kept seeing their private colour instead of the admin's. */
function colorStore(name){
  return Object.assign({}, SERVER_PREFS[name]||{});
}
function applyDistrictColors(){
  const saved=colorStore("districtColors");
  for(const d of DISTRICTS){ if(saved[d.latin]) d.color=saved[d.latin]; }
}

/* ================= nom normalizatsiya ================ */
const CYR = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ь":"","э":"e","ю":"yu","я":"ya","қ":"q","ғ":"g","ў":"o","ҳ":"h"};
function norm(s){
  if(!s) return "";
  s=String(s).toLowerCase();
  let out="";
  for(const ch of s){ out += (CYR[ch]!==undefined?CYR[ch]:ch); }
  return out.replace(/[ʻʼ'`’‘\-–—.,()«»"×]/g,"").replace(/\s+/g,"").replace(/bekati$/,"");

   hammasi aniq ustma-ust tushadi, server keshi orqali tez va offline ishlaydi. */
/* Karta asosi — OSM. Yandex API esa MA'LUMOT to'ldirish uchun ishlatiladi

const BASEMAP = "osm";

/* ── Yaqinlashtirish chegarasi — HUDUDGA QARAB ─────────────────────────────────
   Offline tile to'plami ikki qatlamli qilib yuklanadi (scripts/download_osm_tiles.js):
     • Butun mamlakat  z13 gacha  — hamma joyda siljib yurish
     • 14 viloyat markazi + Toshkent, 12 km  z15 gacha  — chuqur zoom
   Shuning uchun ruxsat etilgan eng katta zoom JOYGA bog'liq: markaz atrofida z15,
   qolgan hamma joyda z13. (z12–z15 lokal seed; z16+ hozircha yo'q — markazdan
   tashqarida yo'q tile so'ralmasin uchun chegara joyga qarab qo'yiladi.)

   Chegaradan nariga o'tib bo'lmaydi: g'ildirak, qo'sh-klik, +/- tugmalari —
   hammasi shu bilan cheklanadi, ya'ni xarita hech qachon yo'qolmaydi. */
const MAX_Z = 15;                    // z12–z15 lokal seed: absolyut eng katta zoom (offline)
const BASE_Z = 13;                   // uniform: hamma joyda z15 (smart layered tile — pastda)
const DEEP_Z = 15;                   // markaz + Toshkent, 12 km — shu yerda to'xtaydi
/* z16 GA CHIQARISH (markazlar + tuman ichidagi kichik shaharlar): z16 tile'lar
   BOR bo'lgandagina yoqiladi — hozir map/tiles/osm/16/ deyarli bo'sh (faqat Toshkent
   ~38%, qolganlari 0). OSM bu IP'ni bloklagan (200 bilan 6987 baytli "Access blocked"
   rasm qaytaradi), shu sababli bu yerda yuklab bo'lmadi. Tarmoq ochilganda:
     node scripts/download_osm_tiles.js        # CENTER_ZOOMS'da z16 allaqachon bor
   yuklab bo'lgach z16 ni yoqish uchun 2 joyni o'zgartiring:
     (1) shu yerda  MAX_Z = 16  va  DEEP_Z = 16;
     (2) pastdagi TAFSILOT qatlamida  maxNativeZoom:16  (hozir 15 — z15 cho'ziladi).
   Aks holda z16'da bo'sh/cho'zilgan tile chiqadi — shu bois hozir xavfsiz z15'da qoldi. */
const DEEP_RADIUS_KM = 12 + 2;       // +2 km — chegarada zoom titramasligi uchun
/* download_osm_tiles.js dagi CENTERS bilan bir xil bo'lishi shart — bo'lmasa
   yuklangan chuqur tile bilan ruxsat etilgan zoom mos kelmaydi. */
const DEEP_CENTERS = [
  [41.311,69.279],[41.038,69.341],[40.783,72.344],[39.767,64.421],[40.389,71.786],
  [40.116,67.842],[41.550,60.631],[41.001,71.673],[40.104,65.373],[38.861,65.789],
  [39.654,66.960],[40.494,68.784],[37.224,67.278],[42.461,59.611],
];
function regionMaxZoom(ll){
  for(const [la,lo] of DEEP_CENTERS){
    const dLat=(ll.lat-la)*111, dLon=(ll.lng-lo)*111*Math.cos(la*Math.PI/180);
    if(Math.sqrt(dLat*dLat+dLon*dLon) <= DEEP_RADIUS_KM) return DEEP_Z;
  }
  return BASE_Z;
}

const OVERPASS = [
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter", // eng barqarori
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
  // "https://overpass.osm.jp/api/interpreter" // O'LIK: SSL sertifikati muddati o'tgan
];
let mirrorIdx = 0;
function qhash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return "ovp_"+h; }
/* ---- IndexedDB doimiy kesh: katta hajm, brauzer yopilsa ham saqlanadi ---- */
let _idb=null;
function idbOpen(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open("mapcache",1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore("kv"); };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
async function cacheGet(key){
  if(!_idb) _idb=await idbOpen();
  if(!_idb) return null;
  return new Promise(res=>{
    try{
      const rq=_idb.transaction("kv","readonly").objectStore("kv").get(key);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
async function cachePut(key,data){
  if(!_idb) _idb=await idbOpen();
  if(!_idb) return;
  try{ _idb.transaction("kv","readwrite").objectStore("kv").put({t:Date.now(),d:data},key); }catch(e){}
}
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const USE_SERVER = location.protocol.startsWith("http"); // server orqali ochilganda proxy-kesh ishlatiladi
const DL = {bytes:0}; // yuklab olish tezligini o'lchash uchun
async function fetchOverpass(query){
  let lastErr;
  if(USE_SERVER){
    try{
      const r = await fetch("/api/overpass",{method:"POST",headers:{"Content-Type":"text/plain"},body:query});
      if(r.ok){ const txt=await r.text(); DL.bytes+=txt.length; return JSON.parse(txt); }
      lastErr = new Error("Server HTTP "+r.status);
    }catch(e){ lastErr=e; }
  }
  for(let round=0; round<3; round++){
    for(let i=0;i<OVERPASS.length;i++){
      const url = OVERPASS[(mirrorIdx++) % OVERPASS.length]; // parallel so'rovlar turli serverlarga tarqaladi
      try{
        const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(query)});
        if(r.ok){ const txt=await r.text(); DL.bytes+=txt.length; return JSON.parse(txt); }
        lastErr = new Error("HTTP "+r.status);
      }catch(e){ lastErr=e; }
    }
    await sleep(4000*(round+1));
  }
  throw lastErr||new Error("Overpass ishlamadi");
}
const _refreshing = new Set();
async function overpass(query){
  const key = qhash(query);
  const cached = await cacheGet(key);
  if(cached && cached.d){
    /* stale-while-revalidate: keshni darhol beramiz, eskirgan bo'lsa fonda yangilaymiz */
    if(Date.now()-cached.t > 24*3600*1000 && !_refreshing.has(key)){
      _refreshing.add(key);
      fetchOverpass(query).then(j=>cachePut(key,j)).catch(()=>{}).finally(()=>_refreshing.delete(key));
    }
    return cached.d;
  }
  const j = await fetchOverpass(query);
  cachePut(key,j);
  return j;
}

/* ---------- point-in-polygon ---------- */
function inRing(pt, ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][1], yi=ring[i][0], xj=ring[j][1], yj=ring[j][0];
    if(((yi>pt[0])!==(yj>pt[0])) && (pt[1] < (xj-xi)*(pt[0]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
const districtGeoms = []; // {d, rings:[latlng-ring,...]}
const regionGeoms = [];   // O'zbekiston viloyatlari ringlari — nuqtalarni UZ ichida filtrlash uchun
function inUzbekistan(lat,lng){
  if(!regionGeoms.length) return true; // viloyatlar hali yuklanmagan bo'lsa filtrsiz
  for(const rings of regionGeoms){ if(rings.some(r=>inRing([lat,lng],r))) return true; }
  return districtGeoms.some(g=>g.rings.some(r=>inRing([lat,lng],r)));
}
function districtOf(lat,lng){
  for(const g of districtGeoms){ if(!g.d.city && g.rings.some(r=>inRing([lat,lng],r))) return g.d; }
  for(const g of districtGeoms){ if(g.d.city && g.rings.some(r=>inRing([lat,lng],r))) return g.d; }
  return null;
}

/* ---------- relation ways -> yopiq ringlar (o'zimizning stitcher) ---------- */
function stitchRings(ways){
  const segs = ways.map(w=>w.map(p=>[p.lat,p.lon])).filter(s=>s.length>1);
  const rings=[];
  const eq=(a,b)=>Math.abs(a[0]-b[0])<1e-7 && Math.abs(a[1]-b[1])<1e-7;
  while(segs.length){
    let ring = segs.shift();
    let closed = eq(ring[0], ring[ring.length-1]);
    let guard = segs.length+2;
    while(!closed && guard-->0){
      const tail = ring[ring.length-1];
      let found=-1, rev=false;
      for(let i=0;i<segs.length;i++){
        if(eq(segs[i][0],tail)){found=i;rev=false;break;}
        if(eq(segs[i][segs[i].length-1],tail)){found=i;rev=true;break;}
      }
      if(found<0) break;
      let nxt = segs.splice(found,1)[0];
      if(rev) nxt = nxt.slice().reverse();
      ring = ring.concat(nxt.slice(1));
      closed = eq(ring[0], ring[ring.length-1]);
    }
    if(ring.length>3) rings.push(ring);
  }
  return rings;
}

/* Result rows are built as an HTML string. The text in them is not ours: OSM
   names carry & and quotes, and the Nominatim/Yandex display_name is a third
   party's string entirely. Both were being injected raw. */
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
const SEARCHABLE = []; // {keys:[norm...], icon, title, sub, area, fire}
/* `area` is the "Viloyat / Tuman" the object sits in, and it is the whole point
   of the result list: place names repeat all over the country, so a search for
   "Bektemir" returns a settlement in Toshkent AND one in Qashqadaryo with the
   same name and the same category. It comes pre-computed from search.json (see
   scripts/build_search_areas.js) — resolving it in the browser would mean
   loading 4 MB of boundary polygons before the first search could answer. */
function addSearchable(names, icon, title, sub, fire, area){
  SEARCHABLE.push({keys:names.filter(Boolean).map(norm), icon, title, sub, area:area||"", fire});
}
const qEl=document.getElementById('q'), qRes=document.getElementById('qres');
let qTimer=null, qSeq=0;
qEl.addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(runSearch,350); });

/* Yandex Geocoder — OSMda belgilanmagan joylarni ham topadi (server orqali proksi) */
async function yandexGeocode(q){
  const js=await (await fetch(`/api/ygeocode?q=${encodeURIComponent(q)}`)).json();
  const fm=(js.response&&js.response.GeoObjectCollection&&js.response.GeoObjectCollection.featureMember)||[];
  return fm.map(f=>{
    const g=f.GeoObject, p=(g.Point&&g.Point.pos||"0 0").split(" ");
    const md=(g.metaDataProperty&&g.metaDataProperty.GeocoderMetaData)||{};
    return {lat:+p[1], lon:+p[0], name:g.name,
      display_name:[g.name, g.description].filter(Boolean).join(", "),
      type:md.kind||"", category:"Yandex", src:"Yandex Geocoder"};
  }).filter(r=>r.lat&&r.lon);
}
async function runSearch(){
  const raw=qEl.value.trim();
  if(raw.length<2){ qRes.style.display="none"; return; }
  const seq=++qSeq;
  const nq=norm(raw);
  const local = SEARCHABLE.filter(s=>s.keys.some(k=>k.includes(nq))).slice(0,7);
  renderResults(local, null);
  /* Yandex + Nominatim PARALLEL — istalgan til/alifbo; OSMda yo'g'i Yandexdan chiqadi */
  const jobs=[
    yandexGeocode(raw),
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw)}&format=jsonv2&limit=6&viewbox=55.9,45.7,73.3,37.1&bounded=1&countrycodes=uz&accept-language=ru,uz`).then(r=>r.json())
  ];
  const rs=await Promise.allSettled(jobs);
  if(seq!==qSeq) return;
  const remote=[];
  if(rs[0].status==="fulfilled") remote.push(...rs[0].value);
  if(rs[1].status==="fulfilled") remote.push(...rs[1].value);
  renderResults(local, remote.slice(0,9));
}
function renderResults(local, remote){
  let html="";
  for(let i=0;i<local.length;i++){
    /* Name, then WHERE it is, then what it is. Identical names are common
       across the country, so the middle line is what tells two hits apart. */
    const a=local[i].area;
    html+=`<div class="qitem" data-k="l${i}">${local[i].icon} <span><b>${esc(local[i].title)}</b>`+
      (a?`<span class="qi-area">${esc(a)}</span>`:"")+
      `<span class="qi-sub">${esc(local[i].sub)} — харитадаги объект</span></span></div>`;
  }
  if(remote){
    for(let i=0;i<remote.length;i++){
      const nm=remote[i].display_name.split(",").slice(0,2).join(",");
      html+=`<div class="qitem" data-k="r${i}">📍 <span><b>${esc(remote[i].name||nm)}</b><span class="qi-sub">${esc(remote[i].display_name.split(",").slice(1,4).join(","))}</span></span></div>`;
    }
  }
  qRes.innerHTML = html || `<div class="qitem">Ҳеч нарса топилмади…</div>`;
  qRes.style.display="block";
  qRes.querySelectorAll('.qitem[data-k]').forEach(el=>{
    el.onclick=()=>{
      const k=el.getAttribute('data-k');
      qRes.style.display="none";
      if(k[0]==="l"){ local[+k.slice(1)].fire(); }
      else{
        const r=remote[+k.slice(1)];
        const lat=+r.lat, lon=+r.lon;
        map.flyTo([lat,lon],Math.min(map.getMaxZoom(),17),{duration:.9});
        if(searchPin) map.removeLayer(searchPin);
        searchPin=L.marker([lat,lon]).addTo(map);
        showInfo("📍 "+(r.name||r.display_name.split(",")[0]),
          row("Тури",(r.type||"")+(r.category?" ("+r.category+")":""))+row("Манба",r.src||"Nominatim / OpenStreetMap"),
          lat,lon);
      }
    };
  });
}

   holatni hech kim o'qimaydi. Yozib qo'yilgan, lekin o'qilmaydigan holat qolsa —

function syncRegionSubgroups(on){
  if(typeof REGIONS==="undefined") return;
  for(const r of REGIONS){
    if(!r._subGroup) continue;
    if(!on) map.removeLayer(r._subGroup);
    else if(r.expanded) map.addLayer(r._subGroup);
  }
}
async function toggleLayer(key,btn){
  const l=layers[key];
  if(l.on){
    l.on=false; btn.classList.remove('on'); map.removeLayer(l.group);
    if(key==="regions") syncRegionSubgroups(false);
    if(key==="districts") collapseAutoExpandedDistricts();
    return;
  }
  l.on=true; btn.classList.add('on');
  if(key==="regions"){ syncRegionSubgroups(true); if(addRepublicBoxes()) refreshPoiLayers(); }
  if(!l.loaded){
    btn.classList.add('loading'); setStatus(l.label+" юкланмоқда…");
    try{ await l.loader(l.group); l.loaded=true; setStatus(""); }
    catch(e){ setStatus(l.label+" хатоси: "+e.message); console.error(e); }
    btn.classList.remove('loading');
  }
  if(l.on){ l.group.addTo(map); refreshViewports(); }
  /* «Туманлар» — Toshkent tumanlari bilan cheklanmasin: hamma viloyat ham
     tumanlarga yoyilsin (bir xil bosish/rang xatti-harakati bilan). */
  if(key==="districts" && l.on){
    btn.classList.add('loading'); setStatus("Барча вилоят туманлари юкланмоқда…");
    try{ await expandAllRegionDistricts(); }
    catch(e){ setStatus("Туманлар хатоси: "+e.message); console.error(e); }
    btn.classList.remove('loading');
  }
  /* Yangi Toshkent yoqilganda — hududiga uchamiz, qalin qizil chegara ko'rinadi */
  if(key==="yangitoshkent" && l.on && loadYangiToshkent.bounds)
    map.flyToBounds(loadYangiToshkent.bounds,{padding:[30,30],duration:.9});
}

    catch(e){ setStatus(l.label+" хатоси: "+e.message); console.error(e); }

function addDistrictPolygon(d, latlngs, group){
  const poly = L.polygon(latlngs,{pane:d.city?"cityPane":"districtsPane",color:d.color,weight:2,opacity:.95,fillColor:d.color,fillOpacity:d.city?.03:.15});
  d._poly = poly;
  poly.on("contextmenu",e=>{ openColorPicker(d, e.originalEvent); L.DomEvent.stop(e); });
  poly.on("click",e=>{
    map.flyToBounds(poly.getBounds(),{padding:[20,20],duration:.8});
    showInfo(d.name,
      row("Лотинча",d.latin)+row("Умумий майдони",d.area)+row("Аҳоли сони",d.pop)+row("Қўшимча",d.extra),
      e.latlng.lat,e.latlng.lng,
      `<span class="lg-sw" style="display:inline-block;background:${d.color}55;border-color:${d.color}"></span>`);
    L.DomEvent.stop(e);
  });
  poly.on("mouseover",()=>poly.setStyle({fillOpacity:.3}));
  poly.on("mouseout",()=>poly.setStyle({fillOpacity:d.city?.03:.15}));
  d._group = group;
  if(!hiddenD.has(d.latin)) group.addLayer(poly);
  // These are the Toshkent-city districts from data.js. "Bektemir Tumani" reads
  // exactly like the settlement of the same name elsewhere, so it gets the same
  // region line as the indexed results.
  addSearchable([d.name,d.latin], "🗺", d.name, "туман", ()=>{
    const c=poly.getBounds().getCenter();
    poly.fire("click",{latlng:c});
  }, "Toshkent");
}
function renderDistrictToggles(){
  const el=document.getElementById('dtoggles');
  el.innerHTML="";

    b.innerHTML=`<span class="lg-dot" style="width:9px;height:9px;background:${d.color}"></span>${d.name}`;
    b.onclick=()=>{
      if(hiddenD.has(d.latin)){ hiddenD.delete(d.latin); d._group.addLayer(d._poly); }
      else { hiddenD.add(d.latin); d._group.removeLayer(d._poly); }
      try{ localStorage.setItem("hiddenDistricts_v2",JSON.stringify([...hiddenD])); }catch(e){}
      renderDistrictToggles();

async function loadDistricts(group){
  /* 1-usul: lokal data.js dagi tayyor GeoJSON chegaralar */
  if(typeof LOCAL_DATA!=="undefined" && LOCAL_DATA.districts_gj){
    for(const item of LOCAL_DATA.districts_gj){
      const d = DISTRICTS.find(x=>x.latin===item.latin);
      if(!d || !item.g) continue;
      d._done = true;
      const polys = item.g.type==="Polygon"? [item.g.coordinates] : item.g.coordinates;
      const latlngs = polys.map(poly=>poly.map(ring=>ring.map(c=>[c[1],c[0]])));
      for(const p of latlngs) districtGeoms.push({d:d, rings:[p[0]]});
      addDistrictPolygon(d, latlngs, group);
    }
    renderDistrictLegend();
    renderDistrictToggles();
    return;
  }
  /* 2-usul: Overpass */
  const q = `[out:json][timeout:90];
    (
      relation(2216724);
      relation["boundary"="administrative"]["admin_level"="6"]["name"~"Qibray|Zangiota|Yuqorichirchiq|O.rtachirchiq|^Toshkent [Tt]umani|Bektemir|Chilonzor|Mirobod|Mirzo Ulug|Olmazor|Sergeli|Shay[xh]onto[xh]ur|Uchtepa|Yakkasaroy|Yashnobod|Yunusobod|Yangi ?[Hh]ayot",i](40.8,68.6,41.75,70.0);
    );
    out geom;`;
  const data = await getData("districts", q);
  for(const rel of data.elements){
    if(rel.type!=="relation") continue;
    const t = rel.tags||{};
    const nm = norm(t["name:uz"]||t.name||"");
    const d = DISTRICTS.find(x=>{
      if(x._done) return false;
      const short = norm(x.latin).replace(/tumani$|shahri$/,"");
      if(x.latin==="Toshkent shahri") return (nm==="toshkent"||nm==="toshkentshahri") ;
      if(x.latin==="Toshkent tumani") return nm==="toshkenttumani";
      if(nm.startsWith("yangitoshkent")) return false;
      if(x.latin==="Shayxontohur tumani") return nm.includes("shayxontohur")||nm.includes("shayhontohur");
      if(x.latin==="Yangihayot tumani") return nm.includes("yangihayot")||nm.includes("yangi hayot".replace(" ",""));
      return nm.includes(short);
    });
    if(!d) continue;
    d._done=true;
    const outerWays = (rel.members||[]).filter(m=>m.type==="way"&&m.geometry&&m.role!=="inner").map(m=>m.geometry);
    const innerWays = (rel.members||[]).filter(m=>m.type==="way"&&m.geometry&&m.role==="inner").map(m=>m.geometry);
    const outers = stitchRings(outerWays);
    const inners = stitchRings(innerWays);
    if(!outers.length) continue;
    districtGeoms.push({d:d, rings:outers});
    const latlngs = outers.map(o=>{
      const holes = inners.filter(h=>inRing(h[0],o));
      return [o].concat(holes);
    });
    addDistrictPolygon(d, latlngs, group);
  }
  renderDistrictLegend();
  renderDistrictToggles();
}

    DISTRICTS.map(d=>`<div class="lg-row"><span class="lg-sw" style="background:${d.color}33;border-color:${d.color}"></span>${d.name}</div>`).join("");
}

const cp = {el:document.getElementById('cpick'), d:null};
function openColorPicker(d, ev, expandable){
  cp.d = d;
  /* Non-admins never see a colour control. The popup still opens for them when
     it carries the expand/collapse action, because that is navigation, not
     styling — dropping it would quietly take a working feature away. When there
     is nothing but colour in it, right-click does nothing at all. */
  const hasAction = !!(expandable || d._parentRegion);
  if(!IS_ADMIN && !hasAction) return;
  const show=(el,on)=>{ if(el) el.style.display = on? "" : "none"; };
  // Hide the colour controls one by one, not by row: Сақлаш shares its row with
  // Бекор, and hiding the row would leave the popup with no way to close.
  show(document.getElementById('cp-wheel'), IS_ADMIN);
  show(document.getElementById('cp-hex').parentElement, IS_ADMIN);   // .hexrow
  show(document.getElementById('cp-save'), IS_ADMIN);
  show(document.getElementById('cp-reset').parentElement, IS_ADMIN); // its own row
  document.getElementById('cp-title').textContent = (IS_ADMIN? "🎨 " : "")+d.name;
  document.getElementById('cp-wheel').value = d.color;
  document.getElementById('cp-hex').value = d.color;
  const xb=document.getElementById('cp-expand');
  if(expandable){
    xb.style.display="block";
    xb.textContent = d.expanded? "Туманларни йиғиш" : "Туманларга ёйиш";
    xb.onclick=async ()=>{
      cp.el.style.display="none";
      if(d.expanded) collapseRegion(d);
      else { try{ await expandRegion(d); }catch(e){ setStatus("Ёйишда хато: "+e.message); } }
    };
  } else if(d._parentRegion){
    /* Tuman (viloyat ичидаги) — o'ng klikда viloyat туманларини YIG'ISH tugmasi */
    xb.style.display="block";
    xb.textContent = "Туманларни йиғиш";
    xb.onclick=()=>{ cp.el.style.display="none"; collapseRegion(d._parentRegion); };
  } else xb.style.display="none";
  const w=230,h=300;
  let x=Math.min(ev.clientX, window.innerWidth-w-10), y=Math.min(ev.clientY, window.innerHeight-h-10);
  cp.el.style.left=x+"px"; cp.el.style.top=y+"px"; cp.el.style.display="block";
}

document.getElementById('cp-hex').addEventListener('input',e=>{
  const v=e.target.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(v)){ document.getElementById('cp-wheel').value=v; previewColor(v); }
});
function previewColor(c){
  if(cp.d && cp.d._poly) cp.d._poly.setStyle({color:c, fillColor:c});
}
function applyColor(c, persist){
  const d=cp.d; if(!d) return;
  if(persist && !IS_ADMIN) return;          // operator cannot repaint anything
  d.color=c;
  if(d._poly) d._poly.setStyle({color:c, fillColor:c});
  renderDistrictLegend();
  if(persist){
    const store=d._store||"districtColors", id=d._id||d.latin;
    const val = (c===d.origColor)? null : c;   // back to original = drop the override
    /* Server only. The colour is a shared setting, so writing a private copy to
       localStorage as well only created a way for one browser to disagree with
       everyone else. A failed save now says so instead of looking saved. */
    if(USE_SERVER){
      fetch("/api/prefs",{method:"POST",headers:adminHeaders(),
        body:JSON.stringify({store:store,id:id,color:val})})
        .then(r=>r.json().catch(()=>({ok:false})))
        .then(j=>{ if(!j||j.ok===false) throw new Error((j&&j.error)||"saqlanmadi"); })
        .catch(e=>{ setStatus("Рангни сақлаб бўлмади: "+(e.message||e)); });
      SERVER_PREFS[store]=SERVER_PREFS[store]||{};
      if(val===null) delete SERVER_PREFS[store][id]; else SERVER_PREFS[store][id]=val;
    }
  }
}
document.getElementById('cp-save').onclick=()=>{

const REGION_LOOKUP = (function(){
  const m = new Map();
  for(const key in REGION_NAMES)
    for(const nm of REGION_NAMES[key]){ const n=norm(nm); if(n && !m.has(n)) m.set(n,key); }
  return m;
})();
/* Uzunroq nom birinchi tekshiriladi: "toshkentviloyati" ichida "toshkent" bor,
   aks holda viloyat har doim SHAHAR deb o'qilardi. */
const REGION_LOOKUP_KEYS = [...REGION_LOOKUP.keys()].sort((a,b)=>b.length-a.length);
function resolveRegionKey(raw){
  const n = norm(raw||"");
  if(!n) return "";
  if(REGION_LOOKUP.has(n)) return REGION_LOOKUP.get(n);
  for(const k of REGION_LOOKUP_KEYS) if(k.length>=5 && n.includes(k)) return REGION_LOOKUP.get(k);
  return "";
}

function toshkentCityBounds(){

    const rel = els.find(e=>e.id===2216724);
    if(!rel) return null;
    const rings = stitchRings((rel.members||[]).filter(m=>m.type==="way"&&m.geometry&&m.role!=="inner").map(m=>m.geometry));
    return rings.length? L.latLngBounds([].concat.apply([],rings)) : null;
  }catch(e){ return null; }
}

const REGION_CENTERS = {

  toshkentviloyati: [41.038, 69.341],   // Nurafshon
  andijon:          [40.783, 72.344],

  qashqadaryo:      [38.861, 65.789],   // Qarshi

/* Uy viloyati uchun boshlang'ich zoom. Ilgari bu yerda butun viloyat konturi
   fitBounds qilinardi — Farg'ona kabi ixcham viloyatda ham z9 atrofida chiqardi,
   ya'ni operator o'z shahrini emas, butun viloyatni uzoqdan ko'rardi. Endi kamera
   viloyat MARKAZIY SHAHRIGA qo'yiladi va zoom shu yerdan boshlanadi. */
const HOME_ZOOM = 12;
/* Viloyat butunlay kadrdan chiqib ketmasin: konturni sig'diradigan zoom'dan
   ko'pi bilan shuncha zinapoya yaqinlashamiz. Katta viloyatlarda (Qoraqalpog'iston,
   Navoiy) bu z12 emas, z9–10 beradi — baribir avvalgidan ancha yaqin. */
const HOME_ZOOM_OVER_FIT = 4;
function applyHomeView(){
  const fit = (b)=>{ if(!b || !b.isValid()) return false;
    map.fitBounds(b,{padding:[20,20],maxZoom:MAX_Z,animate:false}); return true; };
  if(!EMBED_MODE && HOME_REGION && HOME_REGION!==TOSHKENT_CITY){   // embed → doim Toshkent
    const r = REGIONS.find(x=>x.key===HOME_REGION);
    const cc = REGION_CENTERS[HOME_REGION];
    const b = (r && r._poly) ? r._poly.getBounds() : null;
    const center = cc ? L.latLng(cc[0], cc[1]) : ((b && b.isValid()) ? b.getCenter() : null);
    if(center){
      let z = Math.min(HOME_ZOOM, regionMaxZoom(center));
      if(b && b.isValid()){
        const fitZ = map.getBoundsZoom(b, false, L.point(20,20));
        z = Math.max(fitZ, Math.min(z, fitZ + HOME_ZOOM_OVER_FIT));
      }
      map.setView(center, z, {animate:false});
      return;
    }
    if(fit(b)) return;
  }
  /* Toshkentliklar, shuningdek viloyati yozilmagan yoki tanilmagan hisoblar */
  if(fit(toshkentCityBounds())) return;
  map.setView([41.31,69.27],11);
}
const SUB_PALETTE=["#e57373","#64b5f6","#81c784","#ffb74d","#ba68c8","#4db6ac","#f06292","#a1887f","#90a4ae","#dce775","#7986cb","#ffd54f"];
function ringAreaKm2(ring){
  /* taxminiy shoelace, ekvirektangular proyeksiya */
  const lat0=ring[0][0]*Math.PI/180, kx=111.32*Math.cos(lat0), ky=110.57;
  let s=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const x1=ring[j][1]*kx, y1=ring[j][0]*ky, x2=ring[i][1]*kx, y2=ring[i][0]*ky;
    s += x1*y2 - x2*y1;
  }
  return Math.abs(s/2);
}
async function loadRegions(group){
  const q=`[out:json][timeout:200];area["ISO3166-1"="UZ"][admin_level=2]->.uz;relation(area.uz)["boundary"="administrative"]["admin_level"="4"];out geom;`;
  const data = await getData("regions", q);
  const savedC = colorStore("regionColors");
  for(const rel of data.elements){
    if(rel.type!=="relation" || rel.id===2216724) continue;
    const nm = norm((rel.tags||{}).name||"");
    const r = REGIONS.find(x=>{
      if(x._done) return false;
      if(x.key==="toshkentviloyati") return nm==="toshkentviloyati";
      if(x.key==="qoraqalpog") return nm.includes("qoraqalpog")||nm.includes("qaraqalpaq")||nm.includes("karakalpak");
      return nm.includes(x.key);
    });
    if(!r) continue;
    r._done=true; r.relId=rel.id;
    r.origColor=r.color; if(savedC[r.key]) r.color=savedC[r.key];
    const outers=stitchRings((rel.members||[]).filter(m=>m.type==="way"&&m.geometry&&m.role!=="inner").map(m=>m.geometry));
    if(!outers.length) continue;
    regionGeoms.push(outers);
    r._rings=outers;   // offline tuman filtri uchun (nuqta shu viloyat ичидами?)
    const poly=L.polygon(outers,{pane:"regionsPane",color:r.color,weight:2.2,opacity:.9,fillColor:r.color,fillOpacity:.07});
    r._poly=poly; r._store="regionColors"; r._id=r.key; r._group=group;
    poly.on("click",e=>{
      map.flyToBounds(poly.getBounds(),{padding:[20,20],duration:.9});
      showInfo(r.name,
        row("Умумий майдони",r.area)+row("Аҳоли сони",r.pop)+row("Қўшимча",r.extra)+
        row("Туманлари", r.expanded? "ёйилган (ўнг клик → Йиғиш)":"ўнг клик → «Туманларга ёйиш»"),
        e.latlng.lat,e.latlng.lng,
        `<span class="lg-sw" style="display:inline-block;background:${r.color}55;border-color:${r.color}"></span>`);
      L.DomEvent.stop(e);
    });
    poly.on("contextmenu",e=>{ openColorPicker(r, e.originalEvent, true); L.DomEvent.stop(e); });
    group.addLayer(poly);
    addSearchable([r.name,r.key],"🗺",r.name,"вилоят",()=>{ const c=poly.getBounds().getCenter(); poly.fire("click",{latlng:c}); });
  }
  /* saqlangan yoyilgan viloyatlarni tiklash */
  for(const r of REGIONS){ if(r._done && expandedRegions.has(r.key)) { try{ await expandRegion(r,false); }catch(e){ console.warn(e); } } }
}
let DISTRICTS_BOUND=null;   // offline admin_level=6 tumanlar: [{n,c,r}]
/* Bitta tuman poligonini viloyat ичига qo'shish (offline va Overpass ikkalasi uchun umumiy) */
function addSubDistrict(r, name, rings, colorId, i){
  const savedC = colorStore("subColors");
  const sub={name:name, color:savedC[colorId]||SUB_PALETTE[i%SUB_PALETTE.length],
    origColor:SUB_PALETTE[i%SUB_PALETTE.length], _store:"subColors", _id:String(colorId), _parentRegion:r};
  const areaKm = Math.round(rings.reduce((s,rr)=>s+ringAreaKm2(rr),0));
  const poly=L.polygon(rings,{pane:"cityPane",color:sub.color,weight:1.6,opacity:.9,fillColor:sub.color,fillOpacity:.16});
  sub._poly=poly; sub._group=r._subGroup;
  poly.on("click",e=>{
    map.flyToBounds(poly.getBounds(),{padding:[20,20],duration:.8});
    showInfo(sub.name,
      row("Вилоят",r.name)+row("Умумий майдони","~"+areaKm.toLocaleString()+" км² (ҳисобланган)")+
      row("Аҳоли","ОСМ базасида мавжуд эмас")+row("Манба","OpenStreetMap (offline)"),
      e.latlng.lat,e.latlng.lng,
      `<span class="lg-sw" style="display:inline-block;background:${sub.color}55;border-color:${sub.color}"></span>`);
    L.DomEvent.stop(e);
  });
  poly.on("contextmenu",e=>{ openColorPicker(sub, e.originalEvent); L.DomEvent.stop(e); }); // o'ng klik → rang + Йиғиш
  r._subGroup.addLayer(poly);
  addSearchable([sub.name],"🗺",sub.name,"туман",()=>{ const c=poly.getBounds().getCenter(); poly.fire("click",{latlng:c}); }, r.name);
}
async function expandRegion(r, save=true){
  if(r._subGroup){
    map.addLayer(r._subGroup); r.expanded=true;
    if(save) expandedRegions.add(r.key);
    return;
  }
  setStatus(r.name+" туманлари юкланмоқда…");
  r._subGroup = L.layerGroup();
  const man=await loadManifest();
  /* 1) OFFLINE: districts_bound.json — markazi shu viloyат ичидаги tumanlar */
  if(man.bound && man.bound.districts && r._rings){
    if(!DISTRICTS_BOUND){ DISTRICTS_BOUND=(await (await fetch("geodata/layers/districts_bound.json")).json()).p; }
    let i=0;
    for(const it of DISTRICTS_BOUND){
      if(!r._rings.some(ring=>inRing(it.c,ring))) continue;
      // Янги Тошкент — FAQAT o'zining alohida QIZIL qatlamida ko'rinadi (loadYangiToshkent).
      // Tumanlar ichida chizilmasin — aks holda ikki marta (bir marta shu yerda, bir marta
      // qizil qatlamda) chiziladi. Yangihayot bunga tushmaydi (norm != "yangitoshkent").
      if(norm(it.n).includes("yangitoshkent")) continue;
      addSubDistrict(r, it.n||("Tuman "+i), it.r, r.key+"_"+i, i); i++;
    }
  } else {
    /* 2) Zaxira — jonli Overpass */
    const q=`[out:json][timeout:150];area(${3600000000+r.relId})->.a;relation(area.a)["boundary"="administrative"]["admin_level"="6"];out geom;`;
    const data = await overpass(q);
    let i=0;
    for(const rel of data.elements){
      if(rel.type!=="relation") continue;
      const t=rel.tags||{};
      // Янги Тошкент — faqat alohida qizil qatlamda; tumanlar ichida emas (yuqoridagi izohga qarang).
      if(norm(t["name:uz"]||t.name||"").includes("yangitoshkent")) continue;
      const outers=stitchRings((rel.members||[]).filter(m=>m.type==="way"&&m.geometry&&m.role!=="inner").map(m=>m.geometry));
      if(!outers.length) continue;
      addSubDistrict(r, t["name:uz"]||t.name||("Tuman "+rel.id), outers, rel.id, i); i++;
    }
  }
  map.addLayer(r._subGroup);
  r.expanded=true;
  if(save) expandedRegions.add(r.key);
  setStatus("");
  /* bu viloyat hududi uchun yoqilgan nuqta-qatlamlar (Overpass zaxira йўли учун) */
  const b=r._poly.getBounds();
  addPoiBox(`(${b.getSouth().toFixed(3)},${b.getWest().toFixed(3)},${b.getNorth().toFixed(3)},${b.getEast().toFixed(3)})`);
}
function collapseRegion(r){
  if(r._subGroup) map.removeLayer(r._subGroup);
  r.expanded=false;
  expandedRegions.delete(r.key);
}

/* ── «Туманлар» qatlami — BUTUN mamlakat bo'ylab ────────────────────────────
   Ilgari bu qatlam faqat data.js'dagi 16 ta DISTRICTS ni chizardi, ular esa
   Тошкент shahri + uning atrofidagi tumanlar. Ya'ni Farg'onadagi operator
   «Туманлар» ni yoqsa, ekranida Toshkent atrofi bo'yaladi-yu, o'z viloyati
   bo'yalmasdan qolardi — boshqa viloyat tumanlarini ko'rish uchun har bir
   viloyatni alohida o'ng klik → «Туманларга ёйиш» qilish kerak edi.

   Endi qatlam yoqilganda hamma viloyat tumanlari ham chiziladi. Ular
   addSubDistrict() orqali qo'shiladi, ya'ni bosish (uchib borish + маълумот) va
   o'ng klik (rang tanlash) — Toshkent tumanlaridagi bilan bir xil.

   O'chirilganda esa FAQAT shu qatlam ochganlari yig'iladi: foydalanuvchi o'zi
   qo'lda yoygan (yoki boshlanishida o'z viloyati sifatida yoyilgan) viloyat
   joyida qoladi. */
const districtsAutoExpanded = new Set();
async function expandAllRegionDistricts(){
  if(typeof REGIONS==="undefined") return;
  /* Tuman chegaralari viloyat konturi (r._rings) ichidan tanlanadi — konturlar
     esa loadRegions() da hosil bo'ladi. Qatlam o'chiq bo'lsa ham yuklaymiz. */
  if(layers.regions && !layers.regions.loaded){
    try{ await layers.regions.loader(layers.regions.group); layers.regions.loaded=true; }
    catch(e){ console.warn("[districts] viloyatlar yuklanmadi", e); return; }
  }
  for(const r of REGIONS){
    if(!r._rings || r.expanded) continue;
    try{ await expandRegion(r,false); districtsAutoExpanded.add(r.key); }
    catch(e){ console.warn("[districts] "+r.name, e); }
  }
  setStatus("");
}
function collapseAutoExpandedDistricts(){
  if(typeof REGIONS==="undefined") return;
  for(const key of districtsAutoExpanded){
    const r = REGIONS.find(x=>x.key===key);
    if(r) collapseRegion(r);
  }
  districtsAutoExpanded.clear();
}

let metroData = null;
async function fetchMetro(){

  const q = `[out:json][timeout:60];
    node["station"="subway"](40.95,69.05,41.45,69.55);
    out body;
    relation["route"="subway"](40.95,69.05,41.45,69.55);

  return metroData;

async function loadMetroLines(group){
  const data = await fetchMetro();
  /* Har yo'nalish 2 ta relation (borish+qaytish) — ular parallel izlar, shuning uchun
     ikki chiziq chiqadi. Har LINIYANI (rang bo'yicha) FAQAT BIR marta chizamiz. */
  const drawnLines = new Set();
  for(const r of data.elements.filter(e=>e.type==="relation")){
    const t=r.tags||{};
    let color = t.colour;
    if(!color){
      const nm = norm((t.name||"")+(t.ref||""));
      if(nm.includes("chilonzor")||nm.includes("chilanzar")) color=LINES.chilonzor.color;
      else if(nm.includes("ozbekiston")||nm.includes("uzbekist")) color=LINES.uzbekiston.color;
      else if(nm.includes("yunusobod")||nm.includes("yunusabad")) color=LINES.yunusobod.color;
      else color=LINES.halqa.color;
    }
    if(drawnLines.has(color)) continue;   // bu liniya allaqachon chizilgan (teskari yo'nalishни o'tkazamiz)
    drawnLines.add(color);
    for(const m of (r.members||[])){
      if(m.type!=="way" || !m.geometry) continue;
      if(m.role==="platform" || m.role==="stop") continue;   // faqat iz, platforma emas
      group.addLayer(L.polyline(m.geometry.map(p=>[p.lat,p.lon]),{color:color,weight:2.5,opacity:.85}));
    }
  }
  document.getElementById('lg-metro').innerHTML =
    Object.values(LINES).map(l=>`<div class="lg-row"><span class="lg-dot" style="background:${l.color}"></span>${l.name}</div>`).join("");
}
async function loadMetroStations(group){
  const data = await fetchMetro();
  const nodes = data.elements.filter(e=>e.type==="node");
  const used = new Set();
  for(const s of STATIONS){
    const target=norm(s.n);
    const cands=[target].concat(ALIASES[target]||[]);
    let node=null;
    for(const nd of nodes){
      if(used.has(nd.id)) continue;
      const t=nd.tags||{};
      const names=[t.name,t["name:uz"],t["name:ru"],t["name:en"],t.old_name].filter(Boolean).map(norm);
      if(names.some(nn=>cands.some(c=>nn===c||nn.includes(c)||c.includes(nn)))){node=nd;break;}
    }
    let lat,lon;
    if(node){ used.add(node.id); lat=node.lat; lon=node.lon; }
    else if(s.fallback){ lat=s.fallback[0]; lon=s.fallback[1]; }
    else { console.warn("Bekat topilmadi:",s.n); continue; }
    const LN=LINES[s.line];
    const icon=L.divIcon({className:"",iconSize:[9,9],iconAnchor:[5,5],
      html:`<div class="blink-dot" style="width:9px;height:9px;background:${LN.color}"></div>`});
    const m=L.marker([lat,lon],{icon:icon,zIndexOffset:900});
    m.on("click",()=>{
      flyNoJitter([lat,lon],16);
      showInfo("Ⓜ "+s.n,
        row("Йўналиш",`<span class="linebadge" style="background:${LN.color}">${LN.name}</span>`)+
        row("Эски / халқ тилидаги номи",s.old)+row("Жойлашган ҳудуди",s.hud)+
        row("Чегара ва локация",s.izoh)+row("Оператор саволи","«"+s.savol+"»"),
        lat,lon);
    });
    group.addLayer(m);
    addSearchable([s.n,s.old,node&&node.tags?node.tags.name:""], "Ⓜ", s.n, LINES[s.line].name+" метро бекати", ()=>m.fire("click"));
  }
}

/* KVARTAL/MASSIV/MAHALLA chegarasini bosilганда OFFLINE chizish (Overpass'siz, DARHOL, sekinlik yo'q).
   Poligonlar geodata/layers/kvartal_shapes.json dan (PBF'dan ajratilgan, ~26 ming ta). */
let outlineLayer=null;
function drawOutline(rings){
  if(outlineLayer) map.removeLayer(outlineLayer);
  outlineLayer = L.polygon(rings,{color:"#c40000",weight:3.5,fill:false,className:"blinkline"}).addTo(map);
}
/* Xuddi shu joyga qayta "uchish" kartani silkitadi — joyida bo'lsak umuman uchmaymiz */
function flyNoJitter(c, minZoom){
  /* Qidiruvdan joy tanlanganda ilgari z=17 ga uchardi — u yerda tile umuman yo'q,
     ya'ni bitta mahallani bosishning o'zi xaritani bo'shatib qo'yardi. Endi
     chegaradan oshmaydi. */
  const z=Math.min(map.getMaxZoom(), Math.max(map.getZoom(), minZoom||16));
  if(map.getZoom()>=z && map.getCenter().distanceTo(L.latLng(c[0],c[1]))<40) return;
  map.flyTo(c, z, {duration:.8});
}
function clearOutline(){ if(outlineLayer){ map.removeLayer(outlineLayer); outlineLayer=null; } }
let KVARTAL_SHAPES=null;
async function ensureShapes(){
  if(KVARTAL_SHAPES) return KVARTAL_SHAPES;
  KVARTAL_SHAPES=[];
  try{
    const man=await loadManifest();
    if(man.shapes){ KVARTAL_SHAPES=(await (await fetch("geodata/layers/kvartal_shapes.json")).json()).p; }
  }catch(e){}
  return KVARTAL_SHAPES;
}
async function showKvartalOutline(lat,lon,name){
  clearOutline();
  const shapes=await ensureShapes();
  /* 1) nomi mos poligon (eng yaqin markazlisi) */
  let best=null, bd=Infinity;
  if(name){
    const nn=norm(name);
    for(const it of shapes){
      if(!it.n) continue;
      const inm=norm(it.n);
      if(inm===nn || inm.includes(nn) || nn.includes(inm)){
        const dy=it.c[0]-lat, dx=it.c[1]-lon, d=dy*dy+dx*dx;
        if(d<bd){ bd=d; best=it; }
      }
    }
    /* nomi mos, lekin markazi juda uzoq (>3km) — boshqa shahardagi adash bo'lishi mumkin */
    if(best && bd>0.0008) best=null;
  }
  /* 2) topilmasa — nuqta ICHIDA yotgan eng kichik poligon (real massiv chegarasi) */
  if(!best){
    let ba=Infinity;
    for(const it of shapes){
      if(Math.abs(it.c[0]-lat)>0.25 || Math.abs(it.c[1]-lon)>0.3) continue; // uzoqlarni tez o'tkazish
      if(!it.r.some(rr=>inRing([lat,lon],rr))) continue;
      const a=it.r.reduce((s,rr)=>s+ringAreaKm2(rr),0);
      if(a<ba){ ba=a; best=it; }
    }
  }
  /* 3) baribir topilmasa — nuqta yo'l/chekka ustida bo'lishi mumkin: eng yaqin KICHIK poligon (~650 m ichida) */
  if(!best){
    let bd2=Infinity;
    for(const it of shapes){
      const dy=it.c[0]-lat, dx=it.c[1]-lon;
      if(Math.abs(dy)>0.006 || Math.abs(dx)>0.008) continue;
      const a=it.r.reduce((s,rr)=>s+ringAreaKm2(rr),0);
      if(a>3) continue;                       // katta poligon markazi yaqin bo'lsa ham u emas
      const d=dy*dy+dx*dx;
      if(d<bd2){ bd2=d; best=it; }
    }
  }
  if(best){
    drawOutline(best.r);
    /* butun chegara ekranga sig'sin — aks holda qizil chiziq ko'rinmay qoladi */
    map.flyToBounds(outlineLayer.getBounds(),{padding:[40,40],duration:.8,maxZoom:Math.min(map.getMaxZoom(),16)});
    if(best.s==="bl"){ /* binolardan yasalgan taxminiy chegara — halollik uchun aytamiz */
      setStatus("Тахминий чегара (бинолар жойлашуви бўйича) — OSMда аниқ полигон чизилмаган");
      setTimeout(()=>setStatus(""),5000);
    }
    return true;
  }
  setStatus("Бу ҳудуднинг чегара полигони OSM харитасида чизилмаган");
  setTimeout(()=>setStatus(""),4000);
  return false;
}

/* ====== Global qidiruv indeksi (search.json) — fonда BO'LAK-BO'LAK quriladi (qotmaydi) ====== */
function searchMeta(key){
  if(key==="kocha") return {emoji:"🛣",label:"кўча",layerKey:null};
  if(key.endsWith("_b")){
    const bk=key.slice(0,-2);
    if(bk==="regions")   return {emoji:"🗺",label:"вилоят",layerKey:"regions"};
    if(bk==="districts") return {emoji:"🗺",label:"туман",layerKey:"districts"};
    return {emoji:"🏡",label:"маҳалла",layerKey:"mahallalar"};
  }
  const l=layers[key];
  const emoji=l?(l.label.match(/^\S+/)||["📍"])[0]:"📍";
  const label=l?l.label.replace(/^\S+\s*/,""):key;
  return {emoji,label,layerKey:key};
}
function enableLayerFor(key){
  const l=layers[key]; if(!l) return;
  if(l.on){ if(!map.hasLayer(l.group)) l.group.addTo(map); refreshViewports(); return; }
  l.on=true; if(l.btn) l.btn.classList.add('on');
  if(!l.loaded){ l.loader(l.group).then(()=>{ l.loaded=true; l.group.addTo(map); refreshViewports(); }).catch(()=>{}); }
  else { l.group.addTo(map); refreshViewports(); }
}
async function loadSearchIndex(){
  let data;
  try{ data=await (await fetch("geodata/layers/search.json")).json(); }catch(e){ return; }
  const arr=data.p; const AREAS=data.a||[]; let i=0;
  (function chunk(){
    const end=Math.min(i+3000, arr.length);
    for(; i<end; i++){
      const e=arr[i], lat=e[0], lon=e[1], nm=e[2], meta=searchMeta(e[3]);
      /* e[4] indexes data.a — missing on the ~1.7% of points that fall outside
         every boundary, and on an unstamped (older) search.json. */
      const area=(e.length>4 && AREAS[e[4]])||"";
      addSearchable([nm], meta.emoji, nm, meta.label, ()=>{
        map.flyTo([lat,lon], Math.min(map.getMaxZoom(),17), {duration:.8});
        if(searchPin) map.removeLayer(searchPin);
        searchPin=L.marker([lat,lon]).addTo(map);
        showInfo(meta.emoji+" "+nm,
          (area?row("Ҳудуд",area):"")+row("Тури",meta.label)+row("Манба","OpenStreetMap (offline)"), lat, lon);
        if(meta.layerKey) enableLayerFor(meta.layerKey);
      }, area);
    }
    if(i<arr.length) setTimeout(chunk,0);   // navbatdagi bo'lak — asosiy oqim bloklanmaydi
  })();
}
const POI_VIEW=[];    // {group,pts,opts}
const POI_MAX=1800;   // bir qatlamda ekranga bir vaqtda maks nuqta (tezlik uchun)

function refreshViewports(){
  for(const e of POI_VIEW) renderPoiVP(e);

function showPoiInfo(c, t, o){
  const d = o.fixedColor? null : districtOf(c[0],c[1]);

function addPoiMarker(c, t, o, group){

const VP_PAD=0.4;  // 40% marja: kichik surish/zoomда qayta chizilmaydi → titramaydi
/* INKREMENTAL render: mavjud markerlarni saqlaydi, faqat farqni qo'shади/oladi.
   clearLayers ishlatilmaydi — shu sabab bosganда/surganда titrash yo'q. */
function renderPoiVP(e){
  const g=e.group;
  if(!map.hasLayer(g)){ if(e._mk&&e._mk.size){ g.clearLayers(); e._mk.clear(); } return; }
  if(!e._mk) e._mk=new Map();                   // pts-index -> marker
  const pb=map.getBounds().pad(VP_PAD);
  const s=pb.getSouth(), n=pb.getNorth(), w=pb.getWest(), ea=pb.getEast();
  const inside=[];
  for(let i=0;i<e.pts.length;i++){ const p=e.pts[i]; if(p[0]>=s&&p[0]<=n&&p[1]>=w&&p[1]<=ea) inside.push(i); }
  const step = inside.length>POI_MAX? Math.ceil(inside.length/POI_MAX) : 1; // uzoqdan — namuna
  const want=new Set();
  for(let i=0;i<inside.length;i+=step) want.add(inside[i]);
  for(const [idx,m] of e._mk){ if(!want.has(idx)){ g.removeLayer(m); e._mk.delete(idx); } }
  for(const idx of want){ if(!e._mk.has(idx)){ const p=e.pts[idx]; e._mk.set(idx, addPoiMarker([p[0],p[1]], p[3]||{}, e.opts, g)); } }
}
function poiLoader(qtpl,emoji,fallbackTitle,blink,fixedColor,outline){
  const opts={emoji,fallbackTitle,blink,fixedColor,outline,src:"OpenStreetMap (offline)"};
  const seen=new Set(), doneBoxes=new Set();
  const fn = async function(group){
    const key=fn.layerKey;
    const man=await loadManifest();
    /* 1) OFFLINE geodata bo'lsa — shundan (tez, viewport bo'yicha) */
    if(key && man.poi && man.poi[key]){
      if(fn._pts){ refreshViewports(); return; }
      const data=await (await fetch("geodata/layers/"+key+".json")).json();
      fn._pts=data.p;                            // [[lat,lon,name,tags],...]
      /* Yandex API orqali topilgan QO'SHIMCHA obyektlar (OSMda yo'qlari) */
      const ex=await loadYExtra();
      if(ex[key] && ex[key].length){
        fn._pts=fn._pts.concat(ex[key]);
        for(const p of ex[key]) addSearchable([p[2]], opts.emoji, p[2], fallbackTitle+" · Yandex", ()=>{
          map.flyTo([p[0],p[1]],Math.min(map.getMaxZoom(),17),{duration:.8});
          showPoiInfo([p[0],p[1]], p[3]||{}, Object.assign({},opts,{src:"Yandex Maps API"}));
        });
      }
      /* Qidiruv — global search.json indeksidan (bu yerda addSearchable YO'Q,
         shu sabab qatlam yoqilganда qotmaydi). */
      const e={group, pts:fn._pts, opts};
      POI_VIEW.push(e); renderPoiVP(e);
      return;
    }
    /* 2) Zaxira — jonli Overpass (offline fayl topilmasa) */
    const jobs = [...poiBoxes].filter(b=>!doneBoxes.has(b)).map(async b=>{
      const data = await overpass(`[out:json][timeout:120];(${qtpl.split("__BB__").join(b)});out center tags;`);
      doneBoxes.add(b);
      return data;
    });
    const results = await Promise.allSettled(jobs);
    const ovp=Object.assign({},opts,{src:"OpenStreetMap"});
    for(const rz of results){
      if(rz.status!=="fulfilled") { console.warn("poi box xato:",rz.reason&&rz.reason.message); continue; }
      for(const el of rz.value.elements){
        const k=el.type+el.id;
        if(seen.has(k)) continue; seen.add(k);
        const c=centerOf(el); if(!c) continue;
        if(!inUzbekistan(c[0],c[1])) continue;
        const t=el.tags||{};
        const m=addPoiMarker(c,t,ovp,group);
        if(t.name) addSearchable([t.name,t["name:uz"],t["name:ru"],t["name:en"]], emoji, t.name, fallbackTitle, ()=>{
          if(!map.hasLayer(group)) group.addTo(map);
          m.fire("click");
        });
      }
    }
  };
  fn.isPoi = true;
  return fn;
}
/* Yoqilgan (yuklangan) nuqta-qatlamlarni yangi bbox'lar uchun to'ldirish — parallel */
async function refreshPoiLayers(){
  const jobs=[];
  for(const key in layers){
    const l=layers[key];
    if(l.loader.isPoi && l.loaded) jobs.push(l.loader(l.group).catch(e=>console.warn(key,e)));
  }
  if(jobs.length){
    setStatus("Янги ҳудуд қатламлари юкланмоқда…");
    await Promise.allSettled(jobs);
    setStatus("");
  }
}
async function addPoiBox(bboxStr){
  if(poiBoxes.includes(bboxStr)) return;
  poiBoxes.push(bboxStr);
  await refreshPoiLayers();
}

/* ================= DIQQATGA SAZOVOR JOYLAR (LANDMARKLAR) =================
   Yandex Maps uslubida: har bir mashhur joy o'zining HAQIQIY fotosi bilan

  /* Koordinatalar OpenStreetMap (Overpass) dan olingan — binoning markazi */
  const LANDMARKS = [
    {img:"teleminora",  name:"Teleminora",          sub:"Toshkent teleminorasi — 375 m",        lat:41.34568, lng:69.28482},
    {img:"amirtemur",   name:"Amir Temur maydoni",  sub:"Amir Temur haykali",                   lat:41.31118, lng:69.27976},
    {img:"mustaqillik", name:"Mustaqillik maydoni", sub:"Mustaqillik monumenti",                lat:41.31643, lng:69.26680},
    {img:"xastimom",    name:"Xast Imom",           sub:"Hazrati Imom majmuasi",                lat:41.33747, lng:69.24126},
    {img:"minor",       name:"Minor masjidi",       sub:"Minor jome masjidi",                   lat:41.33549, lng:69.27524},
    {img:"chorsu",      name:"Chorsu bozori",       sub:"Chorsu gumbazi — eski shahar bozori",  lat:41.32678, lng:69.23511},

    {img:"navoiy",      name:"Navoiy teatri",       sub:"Alisher Navoiy opera va balet teatri", lat:41.30922, lng:69.27152}
  ];
  map.createPane("landmarksPane").style.zIndex = 610; // popup(700)dan past, markerlardan baland
  const mapEl = document.getElementById("map");
  const D = 46;                 // doira diametri, px
  for(const lm of LANDMARKS){
    const icon = L.divIcon({
      className:"lm-ico", iconSize:[D, D+20], iconAnchor:[D/2, D+20],
      html:`<div class="lm-wrap"><div class="lm-ph" style="background-image:url(${LMPHOTO[lm.img]})"></div><div class="lm-tail"></div><div class="lm-lbl">${lm.name}</div></div>`
    });
    L.marker([lm.lat,lm.lng],{icon, pane:"landmarksPane", riseOnHover:true, title:lm.name})
      .addTo(map)
      .bindPopup(`<img src="${LMPHOTO[lm.img]}" style="width:190px;height:120px;object-fit:cover;border-radius:8px;display:block;margin-bottom:5px"><b>${lm.name}</b><br><span style="color:#777;font-size:12px">${lm.sub}</span>`);
  }
  /* Zoom'ga mos masshtab: z=16 da 100%; 35%–115% oralig'ida o'zgaradi.
     z>=17.5 da belgilar yo'qoladi (binoning o'zi ko'rinadi — Yandex/2GIS kabi),
     z<13.5 da esa faqat yozuvlari yashirinadi, doiralar qoladi */
  function lmScale(){
    const z = map.getZoom();
    const s = Math.max(.35, Math.min(1.15, Math.pow(2,(z-16)*.5)));
    mapEl.style.setProperty("--lmS", s.toFixed(3));
    mapEl.classList.toggle("lm-far", z < 13.5);
    mapEl.classList.toggle("lm-near", z >= 17.5);
  }
  map.on("zoom zoomend", lmScale);
  lmScale();
})();
